name: social-media-local

services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: social-media-dynamodb-local
    restart: unless-stopped
    command: >-
      -jar DynamoDBLocal.jar
      -sharedDb
      -dbPath /home/dynamodblocal/data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/home/dynamodblocal/data
    networks:
      - social-media-local

  hermes:
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile.hermes
    image: social-media-hermes:local
    container_name: social-media-hermes
    restart: unless-stopped
    profiles:
      - hermes
    working_dir: /workspace
    command:
      - sh
      - -c
      - >-
        /opt/hermes/bin/hermes skills trust /workspace &&
        exec /opt/hermes/bin/hermes gateway run
    stdin_open: true
    tty: true
    depends_on:
      - dynamodb-local
    environment:
      HERMES_UID: "${HERMES_UID:-1000}"
      HERMES_GID: "${HERMES_GID:-1000}"
      HERMES_WRITE_SAFE_ROOT: /workspace
    ports:
      - "127.0.0.1:8642:8642"
    volumes:
      - ../..:/workspace
      - ${HERMES_DATA_DIR:-${HOME}/.hermes}:/opt/data
      - ../../.agents/hermes/config.yaml:/opt/data/config.yaml
    networks:
      - social-media-local
    mem_limit: 4g
    cpus: 2.0

networks:
  social-media-local:
    name: social-media-local
