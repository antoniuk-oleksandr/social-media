AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Resources:
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: provided.al2023
      Architectures:
        - arm64
      Handler: bootstrap
      CodeUri: ../../build/auth/
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          AWS_REGION: us-east-1
          APP_ENV: local
          JWT_KID: local
          DYNAMODB_ENDPOINT: http://dynamodb-local:8000
          USERS_TABLE: social-media-local-users
          UNIQUES_TABLE: social-media-local-uniques
          REFRESH_TABLE: social-media-local-refresh-sessions
          JWT_ACCESS_SECRET: local-development-secret
