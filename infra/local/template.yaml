AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Resources:
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Handler: bootstrap
      CodeUri: ../../build/auth/
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          AWS_REGION: us-east-1
          APP_ENV: local
          JWT_KID: local
          DYNAMODB_ENDPOINT: http://dynamodb-local:8000
          USERS_TABLE: social-media-local-users
          UNIQUES_TABLE: social-media-local-uniques
          REFRESH_TABLE: social-media-local-refresh-sessions
          JWT_ACCESS_SECRET: local-development-secret
          OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_SERVICE_NAME: social-media-local-auth
          OTEL_SDK_DISABLED: "false"
          OTEL_TRACES_SAMPLER: parentbased_traceidratio
          OTEL_TRACES_SAMPLER_ARG: "1.0"
      Events:
        Register:
          Type: HttpApi
          Properties: {Path: /api/v1/auth/register, Method: POST}
        Login:
          Type: HttpApi
          Properties: {Path: /api/v1/auth/login, Method: POST}
        Refresh:
          Type: HttpApi
          Properties: {Path: /api/v1/auth/refresh, Method: POST}
        Logout:
          Type: HttpApi
          Properties: {Path: /api/v1/auth/logout, Method: POST}
        CorsPreflight:
          Type: HttpApi
          Properties: {Path: "/{proxy+}", Method: OPTIONS}

  UsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Handler: bootstrap
      CodeUri: ../../build/users/
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          AWS_REGION: us-east-1
          APP_ENV: local
          DYNAMODB_ENDPOINT: http://dynamodb-local:8000
          USERS_TABLE: social-media-local-users
          JWT_KID: local
          JWT_ACCESS_SECRET: local-development-secret
          JWT_ISSUER: social-media-api
          JWT_AUDIENCE: social-media-api
          OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_SERVICE_NAME: social-media-local-users
          OTEL_SDK_DISABLED: "false"
          OTEL_TRACES_SAMPLER: parentbased_traceidratio
          OTEL_TRACES_SAMPLER_ARG: "1.0"
      Events:
        GetUser:
          Type: HttpApi
          Properties: {Path: "/api/v1/users/{userId}", Method: GET}
        UpdateUser:
          Type: HttpApi
          Properties: {Path: /api/v1/users/me, Method: PATCH}

  PostsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Handler: bootstrap
      CodeUri: ../../build/posts/
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          AWS_REGION: us-east-1
          APP_ENV: local
          DYNAMODB_ENDPOINT: http://dynamodb-local:8000
          POSTS_TABLE: social-media-local-posts
          JWT_KID: local
          JWT_ACCESS_SECRET: local-development-secret
          JWT_ISSUER: social-media-api
          JWT_AUDIENCE: social-media-api
          OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_SERVICE_NAME: social-media-local-posts
          OTEL_SDK_DISABLED: "false"
          OTEL_TRACES_SAMPLER: parentbased_traceidratio
          OTEL_TRACES_SAMPLER_ARG: "1.0"
      Events:
        CreatePost:
          Type: HttpApi
          Properties: {Path: /api/v1/posts, Method: POST}
        GetPost:
          Type: HttpApi
          Properties: {Path: "/api/v1/posts/{postId}", Method: GET}
        DeletePost:
          Type: HttpApi
          Properties: {Path: "/api/v1/posts/{postId}", Method: DELETE}

  AdsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Handler: bootstrap
      CodeUri: ../../build/ads/
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          AWS_REGION: us-east-1
          APP_ENV: local
          DYNAMODB_ENDPOINT: http://dynamodb-local:8000
          ADS_TABLE: social-media-local-ads
          JWT_KID: local
          JWT_ACCESS_SECRET: local-development-secret
          JWT_ISSUER: social-media-api
          JWT_AUDIENCE: social-media-api
          ADS_CURSOR_KEY: local-development-ads-cursor-key-change-me
          ADS_CURSOR_KEY_ID: local
          OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_SERVICE_NAME: social-media-local-ads
          OTEL_SDK_DISABLED: "false"
          OTEL_TRACES_SAMPLER: parentbased_traceidratio
          OTEL_TRACES_SAMPLER_ARG: "1.0"
      Events:
        CreateAd:
          Type: HttpApi
          Properties: {Path: /api/v1/ads, Method: POST}
        ListAds:
          Type: HttpApi
          Properties: {Path: /api/v1/ads, Method: GET}
        GetAd:
          Type: HttpApi
          Properties: {Path: "/api/v1/ads/{adId}", Method: GET}
        UpdateAd:
          Type: HttpApi
          Properties: {Path: "/api/v1/ads/{adId}", Method: PATCH}
        DeleteAd:
          Type: HttpApi
          Properties: {Path: "/api/v1/ads/{adId}", Method: DELETE}

  FeedFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Handler: bootstrap
      CodeUri: ../../build/feed/
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          AWS_REGION: us-east-1
          APP_ENV: local
          DYNAMODB_ENDPOINT: http://dynamodb-local:8000
          POSTS_TABLE: social-media-local-posts
          USERS_TABLE: social-media-local-users
          UNIQUES_TABLE: social-media-local-uniques
          ADS_TABLE: social-media-local-ads
          JWT_KID: local
          JWT_ACCESS_SECRET: local-development-secret
          JWT_ISSUER: social-media-api
          JWT_AUDIENCE: social-media-api
          ADS_CURSOR_KEY: local-development-ads-cursor-key-change-me
          ADS_CURSOR_KEY_ID: local
          OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_SERVICE_NAME: social-media-local-feed
          OTEL_SDK_DISABLED: "false"
          OTEL_TRACES_SAMPLER: parentbased_traceidratio
          OTEL_TRACES_SAMPLER_ARG: "1.0"
      Events:
        Feed:
          Type: HttpApi
          Properties: {Path: /api/v1/feed, Method: GET}
